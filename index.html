<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIS Travel Marrocos — Em Manutenção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #0D0D0D;
      --red: #C41E2A;
      --gray-light: #F5F4F1;
      --gray-mid: #888888;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--sans);
      background-color: var(--black);
      color: #FFFFFF;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }
    .maintenance-container {
      max-width: 600px;
      position: relative;
      z-index: 2;
    }
    .brand-logo {
      display: inline-flex;
      flex-direction: column;
      line-height: 1;
      margin-bottom: 48px;
    }
    .logo-main {
      font-family: var(--serif);
      font-size: 2.2rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .logo-sub {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--red);
      margin-top: 4px;
      text-transform: uppercase;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 16px;
      line-height: 1.2;
    }
    p {
      font-size: 1.05rem;
      color: var(--gray-mid);
      margin-bottom: 40px;
      line-height: 1.6;
    }
    .btn-contact {
      display: inline-block;
      background: var(--red);
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.2s;
      cursor: pointer;
    }
    .btn-contact:hover {
      background: #A31822;
    }
    .btn-contact.disabled {
      background: #555555;
      color: #bbbbbb;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .background-pattern {
      position: absolute;
      inset: 0;
      background-image: url('images_site/hero_chefchaouen_blue_city.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      filter: grayscale(100%);
      z-index: 1;
    }
    .footer-info {
      margin-top: 48px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <div class="background-pattern"></div>
  
  <div class="maintenance-container">
    <div class="brand-logo">
      <span class="logo-main">AIS Travel</span>
      <span class="logo-sub">Marrocos</span>
    </div>
    
    <h1>Estamos em manutenção</h1>
    <p>Preparando novidades exclusivas para sua próxima jornada pelo Reino de Marrocos. Voltamos em breve!</p>
    
    <span class="btn-contact disabled">
      Falar no WhatsApp Comercial 🇧🇷
    </span>
    
    <div class="footer-info">
      CNPJ: 59.106.210/0001-01
    </div>
  </div>
</body>
</html>
